name: decomp.dev report

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate ObjDiff progress report
        run: python3 tools/agent/objdiff_report.py --out report.json
      - name: Upload decomp.dev report
        uses: actions/upload-artifact@v4
        with:
          name: us_report
          path: report.json
          if-no-files-found: error
          retention-days: 90
